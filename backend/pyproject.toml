[project]
name = "hestra-api"
version = "0.1.0"
description = "Hestra AI research intelligence backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "httpx>=0.28,<1",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
